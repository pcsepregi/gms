name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, típusok, tesztek, build, E2E (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Shell szkriptek ellenőrzése (shellcheck)
        run: shellcheck -x scripts/*.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Telepítési füstteszt LaunchAgent nélkül (T-INS-01, 02, 04)
        run: scripts/smoke-install.sh --no-launchd
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e

  macos:
    name: Tesztek, build és telepítés LaunchAgenttel (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @gms/shared
      - run: npm test
      - run: npm run build
      - name: Telepítési füstteszt valódi LaunchAgenttel (T-INS-03, 05…08)
        run: scripts/smoke-install.sh
